# Free Render Blueprint: one web service contains the React site, FastAPI API,
# a single-concurrency ARq worker, and the internal contract-test simulator.
# PostgreSQL/object storage and Redis use external free services configured as
# secrets in the Render creation form (Supabase and Upstash respectively).
services:
  - type: web
    name: fairbench-ai-app
    runtime: docker
    region: ohio
    plan: free
    dockerfilePath: ./Dockerfile.render-free
    dockerContext: .
    dockerCommand: python render_free_service.py
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_SIZE
        value: "2"
      - key: DATABASE_MAX_OVERFLOW
        value: "1"
      - key: REDIS_URL
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: fairbench-assets
      - key: S3_REGION
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: S3_AUTO_CREATE_BUCKET
        value: "false"
      - key: AGNES_API_URL
        sync: false
      - key: AGNES_API_KEY
        sync: false
      - key: AGNES_AUTH_SCHEME
        value: bearer
      - key: AGNES_AUTH_HEADER
        value: Authorization
      - key: AGNES_PROVIDER_MODE
        value: openai_vision
      - key: AGNES_MODEL
        value: agnes-2.0-flash
      - key: AGNES_TIMEOUT_SECONDS
        value: "20"
      - key: AGNES_MAX_RETRIES
        value: "3"
      - key: AGNES_MAX_CONCURRENCY
        value: "2"
      - key: WORKER_MAX_JOBS
        value: "1"
      - key: API_SECRET_TTL_SECONDS
        value: "86400"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: LOCAL_SINGLE_USER_MODE
        value: "true"
      - key: LOCAL_ADMIN_EMAIL
        value: local-admin@fairbench.local
      - key: LOCAL_ADMIN_DISPLAY_NAME
        value: Fair Bench Administrator
      - key: SEED_DEMO_DATA
        value: "true"
